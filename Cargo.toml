[package]
name = "psql-freya"
version = "0.1.0"
edition = "2021"

[dependencies]
freya = { version = "0.4.0-rc.19", features = ["radio", "icons"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1", "array-impls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4.44"
regex = "1"
url = "2"
uuid = "1"
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
